# configuration for mujoco_rl_him
policy_path: "pre_train/pineapplev0_lab/2026-01-23_15-13-56.pt"
# policy_path: "pre_train/pineapplev0/policy_1.pt"
xml_path: "source/pineapple_rl_lab/pineapple_rl_lab/assets/data/Robots/csl/pineapplev0_description/quick_scence.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.005
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 4

kps: [25, 25, 25, 25, 0, 0]
kds: [0.5, 0.5, 0.5, 0.5, 0.3, 0.3]
# kps: [20, 20, 0, 20, 20, 0]
# kds: [0.5, 0.5, 1.0, 0.5, 0.5, 1.0]


# default_angles: [1.22, -1.92, 0, 1.22, -1.92, 0]
default_angles: [1.401, 1.401, -2.0717, -2.0717, 0, 0]
# default_angles: [0.9219, -1.4399, 0, 0.9219, -1.4399, 0]

lin_vel_scale: 2.0
ang_vel_scale: 0.25

dof_pos_scale: 1.0
dof_vel_scale: 0.05
pos_action_scale: 0.5  # 0.5
vel_action_scale: 5.0
cmd_scale: [1.0, 1.0, 1.0]
num_actions: 6
num_obs: 150
one_step_obs_size: 25
obs_buffer_size: 6
leg_joint_indices: [0, 1, 2, 3]
wheel_joint_indices: [4, 5]
policy_index_map: [0, 3, 1, 4, 2, 5] # Mapping from policy index to xml index. Change this if policy order differs from XML order.


cmd_init: [0.0, 0.0, 0.0]
max_lin_vel: 1.0
max_ang_vel: 3.0
