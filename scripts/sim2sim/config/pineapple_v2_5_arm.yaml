# MuJoCo replay config for Template-Pineapple-Arm-Rl-Lab-v2.5.
# Policy observation order per step:
#   base_ang_vel(3), projected_gravity(3), base_velocity_cmd(3), ee_pose_cmd(7),
#   joint_pos_rel(12), joint_vel_rel(14), last_action(14) = 56
# policy_path: "logs/rsl_rl/pineapple_arm_flat_v2_5/2026-05-21_15-15-25/exported/policy.pt" # ee pose reward 3,
policy_path: "logs/rsl_rl/pineapple_arm_flat_v2_5/2026-05-21_18-14-49/exported/policy.pt" # ee pose reward 5,
xml_path: "source/pineapple_rl_lab/pineapple_rl_lab/assets/data/Robots/csl/pineapple_v2_arm/scene.xml"

simulation_duration: 60
simulation_dt: 0.005
control_decimation: 4

# MuJoCo locomotion sensor/actuator order.
loco_joint_names:
  - L_hip_joint
  - L_thigh_joint
  - L_calf_joint
  - L_wheel_joint
  - R_hip_joint
  - R_thigh_joint
  - R_calf_joint
  - R_wheel_joint
loco_actuator_names:
  - L_hip
  - L_thigh
  - L_calf
  - L_wheel
  - R_hip
  - R_thigh
  - R_calf
  - R_wheel

# v2.5 policy action order: leg position, wheel velocity, arm position.
leg_joint_names:
  - L_hip_joint
  - L_thigh_joint
  - L_calf_joint
  - R_hip_joint
  - R_thigh_joint
  - R_calf_joint
wheel_joint_names:
  - L_wheel_joint
  - R_wheel_joint
arm_joint_names:
  - arm_base_joint
  - arm_link1_joint
  - arm_link2_joint
  - arm_link4_joint
  - arm_link5_joint
  - arm_link6_joint
arm_actuator_names:
  - arm_actuator1
  - arm_actuator2
  - arm_actuator3
  - arm_actuator4
  - arm_actuator5
  - arm_actuator6

# IsaacLab-resolved observation order for v2.5 arm policy.
policy_joint_pos_names:
  - L_hip_joint
  - R_hip_joint
  - arm_base_joint
  - L_thigh_joint
  - R_thigh_joint
  - arm_link1_joint
  - L_calf_joint
  - R_calf_joint
  - arm_link2_joint
  - arm_link4_joint
  - arm_link5_joint
  - arm_link6_joint
policy_joint_vel_names:
  - L_hip_joint
  - R_hip_joint
  - arm_base_joint
  - L_thigh_joint
  - R_thigh_joint
  - arm_link1_joint
  - L_calf_joint
  - R_calf_joint
  - arm_link2_joint
  - L_wheel_joint
  - R_wheel_joint
  - arm_link4_joint
  - arm_link5_joint
  - arm_link6_joint

kps: [40.0, 25.0, 25.0, 0.0, 40.0, 25.0, 25.0, 0.0]
kds: [1.0, 0.5, 0.5, 0.3, 1.0, 0.5, 0.5, 0.3]
arm_kps: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]
arm_kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

default_loco_angles: [-0.1, 0.83, -1.484, 0.0, 0.1, 0.83, -1.484, 0.0]
default_arm_angles: [0.0, 1.57, -0.785, -0.785, 0.0, 0.0]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
pos_action_scale: 0.5
vel_action_scale: 5.0
arm_pos_action_scale: 0.5
cmd_scale: [1.0, 1.0, 1.0]

num_actions: 14
one_step_obs_size: 56
obs_buffer_size: 10
num_obs: 560

cmd_init: [0.0, 0.0, 0.0]
max_lin_vel: 0.5
max_ang_vel: 0.5

# End-effector pose command in the robot base frame: x, y, z, qw, qx, qy, qz.
# v2.5 trains with a full EE pose command. z is base-frame height, approximately
# world target height minus the base height at reset.
ee_pose_init: [0.45, 0.0, 0.25, 1.0, 0.0, 0.0, 0.0]
ee_pos_min: [0.4, -0.2, 0.1]
ee_pos_max: [0.55, 0.2, 0.35]
ee_pos_step: 0.01
ee_rot_step: 0.05
